function divide(a, b, callback) {
  if (b === 0) {
    callback("Cannot divide by zero", null);
  } else {
    callback(null, a / b);
  }
}

    function delay(ms, value) {
        return new Promise(resolve => {
            setTimeout(() => resolve(value), ms);
        });
    }

    async function runParallel() {
        const results = await Promise.all([
            delay(1000, "A"),
            delay(2000, "B"),
            delay(1500, "C"),
        ]);
