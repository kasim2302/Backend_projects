//11. Write a function getCharFrequency(str) that takes a string and returns an object where://

function getcharcount(str){
    let count = {}
    for(let i = 0 ; i < str.length ; i++){
        let char = str[i]
        if(count[char]){
            count[char]++
        }
        else{
            count[char] = 1
        }
    }
    return count
}

console.log(getcharcount("apple"))


// second largest number in an array//

function secondlargestNumber(arr) {
  let max = arr[0];
  let second = arr[0];

  for (let i = 1; i < arr.length; i++) {
    if (arr[i] > max) {
      second = max;
      max = arr[i];
    } 
    else if (arr[i] < max && arr[i] > second) {
      second = arr[i];
    }
  }

  return second === max ? null : second;
}

console.log(secondlargestNumber([5, 2, 3, 1]))

//anagram checking//

function isAnagram(str1, str2) {
  let s1 = str1.replace(/\s/g, "").toLowerCase();
  let s2 = str2.replace(/\s/g, "").toLowerCase();

  return s1.split("").sort().join("") === s2.split("").sort().join("");
}
console.log(isAnagram("madam","madam"))

//Duplicate array//

function uniquevalue(arr){
    let result = []

    for(let i=0 ; i< arr.length ; i++){
        let isDuplicate = false

        for(let j=0 ; j< arr.length ; j++){
            if(arr[i] === result[j]){
                isDuplicate = true
                break
            }
        }
        if(!isDuplicate){
            result.push(arr[i])
        }
    }
    return result
}

console.log(uniquevalue([1,1,2,2,3,3,5,7]));

// Group people by age You get an array of objects://

function groupByAge(people) {
  let result = {};

  for (let i = 0; i < people.length; i++) {
    let age = people[i].age;
    let name = people[i].name;

    if (result[age]) {
      result[age].push(name);
    } else {
      result[age] = [name];
    }
  }

  return result;
}
const people = [
  { name: "Ajay", age: 20 },
  { name: "Ravi", age: 21 },
  { name: "Kumar", age: 20 },
  { name: "Sara", age: 22 },
];

console.log(groupByAge(people));

// Factorial number//

function factorial(num8){
    let fact = 1
    for(let i = 1 ; i <= num8 ; i++){
        fact = fact * i
    }
    return fact
}

//Reverse String //
function reverseStr(str3){
  let reversed = ""
  for(let i = str3.length - 1 ; i >=0;i--){
    reversed += str3[i]
  }
  return reversed
}

//prime number or not//

function isPrime(num) {
  if (num <= 1) {
    return false;
  }

  for (let i = 2; i < num; i++) {
    if (num % i === 0) {
      return false;
    }
  }

  return true;
}
console.log(isPrime(9))
