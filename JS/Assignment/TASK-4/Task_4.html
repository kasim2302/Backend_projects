<script>

 function runTask(callback) {
    callback(() => {
        console.log("Task Completed")
    });
}

function asyncTask(done) {
    setTimeout(() => {
        console.log("Async Task Done")
        done()
    }, 1000)
}

runTask(asyncTask);
